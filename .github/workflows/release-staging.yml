name: publish-staging
on:
  workflow_run:
    workflows: ["CI"]
    branches: [ main, master ]
    types:
      - completed

permissions:
  contents: write                # required to push tags & create releases

jobs:
  prerelease:
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0          # required to create & push tags

      - name: Compute tag (UTC timestamp)
        id: meta
        run: |
          set -euo pipefail
          # Try to find the latest semver-style tag like v1.2.3, fallback on
          # v0.0.0 if there is no tag yet
          LATEST_TAG="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v "patch" | head -n1)"
          LATEST_TAG=$(test -n "$LATEST_TAG" && echo "$LATEST_TAG" || echo "v0.0.0")
          SHORT_SHA="$(git rev-parse --short HEAD)"
          TAG="${LATEST_TAG}-patch-${SHORT_SHA}"

          # Get a timestamp to have unique tags even when multiple pre-releases are created for the same commit
          TIMESTAMP="$(date +%Y%m%d%H%M%S)"
          TAG="${LATEST_TAG}-patch-${SHORT_SHA}-${TIMESTAMP}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Generated tag: ${TAG}"

      - name: Create and push tag
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${TAG}" -m "Automated pre-release from ${GITHUB_REF_NAME} at $(date -u -Iseconds)"
          git push origin "${TAG}"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          check-latest: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GORELEASER_CURRENT_TAG: ${{ steps.meta.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CGO_ENABLED: 0
